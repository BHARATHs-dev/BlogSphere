<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account - BlogSphere</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">✦</span>
        <span>BlogSphere</span>
      </a>

      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#explore">Explore</a></li>
        <li><a href="create-blog.html">Write</a></li>
      </ul>

      <div class="nav-actions" id="navAuthActions">
        <a href="login.html" class="btn btn-secondary btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <!-- Register Main Content -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Join BlogSphere</h1>
        <p>Start writing insightful articles and engage with a global audience.</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="fullname">Full Name</label>
          <input type="text" id="fullname" class="form-control" placeholder="Enter your full name" required
            autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Enter your username" required
            autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="Enter your email address" required
            autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required
            autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter your password" required
            autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Create Account
        </button>
      </form>

      <div class="auth-bottom-switch">
        Already have an account?
        <a href="login.html"><strong>Sign in here</strong></a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 BlogSphere. All rights reserved.</div>
        <div>
          <a href="index.html">Home</a>
          <a href="login.html">Sign In</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>

</html>
